# E2 · Google Drive connection check (docs/26-instagram-publisher.md). Manual only.
# Receives only the Google secrets: no OpenAI, no Instagram. Creates a test file in VERK Social/_pruebas/.
name: social-drive-check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: social-drive-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --omit=dev
      - name: Drive check
        run: node scripts/social/drive-check.mjs
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          DRIVE_ROOT_FOLDER_ID: ${{ vars.DRIVE_ROOT_FOLDER_ID }}
