# VERK Instagram publisher (docs/26-instagram-publisher.md): generate → validate → Drive → (publish).
# Daily automatic operation (authorized 2026-11-11): each scheduled run generates, validates, stores in Drive and
# publishes at the exact slot time, only while the variable SOCIAL_ENABLED is "true" (master switch).
# Human-confirmed publication of a reviewed piece: workflow social-publish-ready.
# Public repo: no pull_request triggers, read-only token, logs carry ids and states only.
name: social

on:
  workflow_dispatch:
    inputs:
      slot:
        description: Horario local (León) · 0800 y 1300 imagen individual · 1900 carrusel
        type: choice
        options: ['0800', '1300', '1900']
        required: true
      dry_run:
        description: Generar, validar y guardar en Drive sin publicar (consume OpenAI)
        type: boolean
        default: true
      now:
        description: No esperar a la hora del horario
        type: boolean
        default: false
      check_only:
        description: Solo comprobaciones gratuitas (cuenta de Instagram, modelos de OpenAI, Drive); no genera ni publica
        type: boolean
        default: false
      date:
        description: Recuperación · fecha local del horario (AAAA-MM-DD); vacío = hoy en León
        type: string
        default: ''
      reuse_library:
        description: Recuperación · reutilizar la pieza editorial guardada del horario (no llama a 00/02/03)
        type: boolean
        default: false
      objetivo:
        description: Recuperación · objetivo editorial fijo; vacío = lo elige el director
        type: choice
        options: ['', 'conversión', 'reconocimiento del problema', 'posicionamiento', 'educativa']
        default: ''
  # UTC; León = UTC−6 todo el año. Arranca 90 min antes del horario (un carrusel con regeneraciones puede tardar
  # más de 45 min); la publicación espera a la hora exacta. GitHub no ejecuta horarios pasados (sin retroactivos).
  schedule:
    - cron: '30 12 * * *' # 06:30 León → publica 08:00 (imagen individual)
    - cron: '30 17 * * *' # 11:30 León → publica 13:00 (imagen individual)
    - cron: '30 23 * * *' # 17:30 León → publica 19:00 (carrusel)
  # Respaldo 30 min después de cada arranque (GitHub puede retrasar o descartar un cron): solo actúa si el horario
  # todavía no tiene manifest (--only-if-missing); nunca genera una segunda pieza ni reintenta una fallida.
    - cron: '0 13 * * *'  # 07:00 León → respaldo del horario 0800
    - cron: '0 18 * * *'  # 12:00 León → respaldo del horario 1300
    - cron: '0 0 * * *'   # 18:00 León (00:00 UTC del día siguiente) → respaldo del horario 1900

permissions:
  contents: read

env:
  SLOT: ${{ inputs.slot || ((github.event.schedule == '30 12 * * *' || github.event.schedule == '0 13 * * *') && '0800') || ((github.event.schedule == '30 17 * * *' || github.event.schedule == '0 18 * * *') && '1300') || '1900' }}

concurrency:
  group: social-${{ inputs.slot || ((github.event.schedule == '30 12 * * *' || github.event.schedule == '0 13 * * *') && '0800') || ((github.event.schedule == '30 17 * * *' || github.event.schedule == '0 18 * * *') && '1300') || '1900' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --omit=dev
      - run: node --test scripts/social/*.test.mjs
      - name: Generar y publicar
        run: node scripts/social/run.mjs --slot "$SLOT" ${DATE:+--date "$DATE"} ${OBJETIVO:+--objetivo "$OBJETIVO"} ${{ inputs.reuse_library && '--reuse-library' || '' }} ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.now && '--now' || '' }} ${{ inputs.check_only && '--check' || '' }} ${{ contains(fromJSON('["0 13 * * *","0 18 * * *","0 0 * * *"]'), github.event.schedule) && '--only-if-missing' || '' }}
        env:
          DATE: ${{ inputs.date }}
          OBJETIVO: ${{ inputs.objetivo }}
          SOCIAL_ENABLED: ${{ vars.SOCIAL_ENABLED }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL }}
          TEXT_MODEL: ${{ vars.TEXT_MODEL }}
          VISION_MODEL: ${{ vars.VISION_MODEL }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          DRIVE_ROOT_FOLDER_ID: ${{ vars.DRIVE_ROOT_FOLDER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ vars.INSTAGRAM_USER_ID }}
          INSTAGRAM_USERNAME: ${{ vars.INSTAGRAM_USERNAME }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION }}
