# VERK Instagram publisher (docs/26-instagram-publisher.md): generate → validate → Drive → (publish).
# Manual only. The schedule stays commented until it is expressly authorized.
# Scheduled/manual runs without dry_run publish only when the variable SOCIAL_ENABLED is "true".
# Human-confirmed publication of a reviewed piece: workflow social-publish-ready.
# Public repo: no pull_request triggers, read-only token, logs carry ids and states only.
name: social

on:
  workflow_dispatch:
    inputs:
      slot:
        description: Horario local (León) · 0800 y 1300 imagen individual · 1900 carrusel
        type: choice
        options: ['0800', '1300', '1900']
        required: true
      dry_run:
        description: Generar, validar y guardar en Drive sin publicar (consume OpenAI)
        type: boolean
        default: true
      now:
        description: No esperar a la hora del horario
        type: boolean
        default: false
  # Activar solo con autorización. UTC; León = UTC−6 todo el año. Arranca 90 min antes del horario
  # (un carrusel con regeneraciones puede tardar más de 45 min); la publicación espera a la hora exacta.
  # schedule:
  #   - cron: '30 12 * * *' # 06:30 → horario 0800
  #   - cron: '30 17 * * *' # 11:30 → horario 1300
  #   - cron: '30 23 * * *' # 17:30 → horario 1900

permissions:
  contents: read

env:
  SLOT: ${{ inputs.slot || (github.event.schedule == '30 12 * * *' && '0800') || (github.event.schedule == '30 17 * * *' && '1300') || '1900' }}

concurrency:
  group: social-${{ inputs.slot || (github.event.schedule == '30 12 * * *' && '0800') || (github.event.schedule == '30 17 * * *' && '1300') || '1900' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --omit=dev
      - run: node --test scripts/social/*.test.mjs
      - name: Generar y publicar
        run: node scripts/social/run.mjs --slot "$SLOT" ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.now && '--now' || '' }}
        env:
          SOCIAL_ENABLED: ${{ vars.SOCIAL_ENABLED }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL }}
          TEXT_MODEL: ${{ vars.TEXT_MODEL }}
          VISION_MODEL: ${{ vars.VISION_MODEL }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          DRIVE_ROOT_FOLDER_ID: ${{ vars.DRIVE_ROOT_FOLDER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ vars.INSTAGRAM_USER_ID }}
          INSTAGRAM_USERNAME: ${{ vars.INSTAGRAM_USERNAME }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION }}
