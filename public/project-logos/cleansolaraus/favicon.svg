<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" fill="#1a6b3a"/>
  <!-- Sun -->
  <circle cx="16" cy="10" r="3.5" fill="#f5c842"/>
  <line x1="16" y1="4.5" x2="16" y2="6" stroke="#f5c842" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="14" x2="16" y2="15.5" stroke="#f5c842" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10.5" y1="10" x2="9.4" y2="8.9" stroke="#f5c842" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="21.5" y1="10" x2="22.6" y2="8.9" stroke="#f5c842" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="8" y1="10" x2="6.5" y2="10" stroke="#f5c842" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="10" x2="25.5" y2="10" stroke="#f5c842" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Solar panel body -->
  <rect x="6" y="17" width="20" height="11" rx="1.5" fill="#e8f5e9"/>
  <!-- Panel grid lines -->
  <line x1="12.7" y1="17" x2="12.7" y2="28" stroke="#1a6b3a" stroke-width="0.8" opacity="0.4"/>
  <line x1="19.3" y1="17" x2="19.3" y2="28" stroke="#1a6b3a" stroke-width="0.8" opacity="0.4"/>
  <line x1="6" y1="20.7" x2="26" y2="20.7" stroke="#1a6b3a" stroke-width="0.8" opacity="0.4"/>
  <line x1="6" y1="24.3" x2="26" y2="24.3" stroke="#1a6b3a" stroke-width="0.8" opacity="0.4"/>
  <!-- Shine highlight -->
  <rect x="7.5" y="18.5" width="4" height="1.2" rx="0.5" fill="white" opacity="0.5"/>
</svg>
